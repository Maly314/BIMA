<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">BIMA implementation history</title>
  <desc id="desc">A chronological plot of BIMA development milestones from July 20 through August 11, 2026.</desc>
  <rect width="1800" height="900" fill="#fbfcfd"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="100" y="95" fill="#122033" font-size="42" font-weight="650">BIMA implementation history</text>
    <text x="100" y="135" fill="#65717d" font-size="20">Evidence-backed development chronology · Central Time</text>

    <line x1="120" y1="235" x2="1680" y2="235" stroke="#172d49" stroke-width="4"/>
    <path d="M1680 235 L1659 223 L1659 247 Z" fill="#172d49"/>

    <g stroke="#dce3e8" stroke-width="1">
      <line x1="300" y1="280" x2="300" y2="800"/>
      <line x1="570" y1="280" x2="570" y2="800"/>
      <line x1="840" y1="280" x2="840" y2="800"/>
      <line x1="1110" y1="280" x2="1110" y2="800"/>
      <line x1="1380" y1="280" x2="1380" y2="800"/>
    </g>

    <g>
      <circle cx="165" cy="235" r="12" fill="#087886" stroke="#fbfcfd" stroke-width="5"/>
      <circle cx="435" cy="235" r="12" fill="#087886" stroke="#fbfcfd" stroke-width="5"/>
      <circle cx="705" cy="235" r="12" fill="#70aee8" stroke="#fbfcfd" stroke-width="5"/>
      <circle cx="975" cy="235" r="12" fill="#79a77d" stroke="#fbfcfd" stroke-width="5"/>
      <circle cx="1245" cy="235" r="12" fill="#d6a92d" stroke="#fbfcfd" stroke-width="5"/>
      <circle cx="1515" cy="235" r="12" fill="#087886" stroke="#fbfcfd" stroke-width="5"/>
    </g>

    <g font-size="20" fill="#122033">
      <g transform="translate(95 0)">
        <text x="0" y="315" font-size="29" font-weight="700" fill="#087886">JUL 20</text>
        <text x="0" y="352" font-size="17" font-weight="700" letter-spacing="1.6">FOUNDATION</text>
        <line x1="0" y1="370" x2="160" y2="370" stroke="#087886" stroke-width="2"/>
        <text x="0" y="414">Movement sensor</text><text x="0" y="441">capture interface</text>
        <text x="0" y="491">Webcam hand</text><text x="0" y="518">tracking</text>
        <text x="0" y="568">Video recording</text>
      </g>

      <g transform="translate(365 0)">
        <text x="0" y="315" font-size="29" font-weight="700" fill="#087886">AUG 05</text>
        <text x="0" y="352" font-size="17" font-weight="700" letter-spacing="1.4">DESKTOP SYSTEM</text>
        <line x1="0" y1="370" x2="175" y2="370" stroke="#087886" stroke-width="2"/>
        <text x="0" y="414">Made GitHub repo</text>
        <text x="0" y="464">Four-IMU firmware</text><text x="0" y="491">and calibration</text>
        <text x="0" y="541">Patient metadata</text><text x="0" y="568">and corrected age</text>
        <text x="0" y="618">Synthetic modelling</text>
        <text x="0" y="668">Pose research</text><text x="0" y="695">and branding</text>
      </g>

      <g transform="translate(635 0)">
        <text x="0" y="315" font-size="29" font-weight="700" fill="#4e94d4">AUG 08</text>
        <text x="0" y="352" font-size="17" font-weight="700" letter-spacing="1.4">ARCHITECTURE</text>
        <line x1="0" y1="370" x2="175" y2="370" stroke="#70aee8" stroke-width="2"/>
        <text x="0" y="414">SAM baseline</text><text x="0" y="441">characterization</text>
        <text x="0" y="491">Persistence split</text>
        <text x="0" y="541">Patient and recording</text><text x="0" y="568">workspace extraction</text>
        <text x="0" y="618">Sensor and video</text><text x="0" y="645">view isolation</text>
        <text x="0" y="695">Electron policies</text>
      </g>

      <g transform="translate(905 0)">
        <text x="0" y="315" font-size="29" font-weight="700" fill="#66966c">AUG 09</text>
        <text x="0" y="352" font-size="17" font-weight="700" letter-spacing="1.4">RELIABILITY</text>
        <line x1="0" y1="370" x2="175" y2="370" stroke="#79a77d" stroke-width="2"/>
        <text x="0" y="414">Desktop layout</text><text x="0" y="441">repair</text>
        <text x="0" y="491">Renderer and SAM</text><text x="0" y="518">recovery</text>
        <text x="0" y="568">Output, cleanup,</text><text x="0" y="595">and lifecycle tests</text>
        <text x="0" y="645">Four-IMU synthetic</text><text x="0" y="672">benchmark</text>
        <text x="0" y="722">Windows asset fix</text>
      </g>

      <g transform="translate(1175 0)">
        <text x="0" y="315" font-size="29" font-weight="700" fill="#b98a14">AUG 10</text>
        <text x="0" y="352" font-size="17" font-weight="700" letter-spacing="1.4">DATA CONTROL</text>
        <line x1="0" y1="370" x2="175" y2="370" stroke="#d6a92d" stroke-width="2"/>
        <text x="0" y="414">Configurable durable</text><text x="0" y="441">data archive</text>
        <text x="0" y="491">Analysis-ready CSV</text><text x="0" y="518">and data dictionary</text>
        <text x="0" y="568">SAM access and</text><text x="0" y="595">performance testing</text>
        <text x="0" y="645">Persistent-worker</text><text x="0" y="672">validation</text>
      </g>

      <g transform="translate(1445 0)">
        <text x="0" y="315" font-size="29" font-weight="700" fill="#087886">AUG 11</text>
        <text x="0" y="352" font-size="17" font-weight="700" letter-spacing="1.4">PRODUCT FOCUS</text>
        <line x1="0" y1="370" x2="175" y2="370" stroke="#087886" stroke-width="2"/>
        <text x="0" y="414">Removed SAM from</text><text x="0" y="441">the active interface</text>
        <text x="0" y="491">Hand-pose tracking</text><text x="0" y="518">retained</text>
        <text x="0" y="568">Historical recording</text><text x="0" y="595">compatibility kept</text>
      </g>
    </g>

    <line x1="100" y1="810" x2="1700" y2="810" stroke="#dce3e8" stroke-width="1"/>
    <text x="100" y="850" fill="#65717d" font-size="18">39 committed checkpoints · July 20–August 11, 2026 · Detailed code ledger follows below</text>
  </g>
</svg>
